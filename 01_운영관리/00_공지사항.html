<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>공지사항</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11v2a3 3 0 0 0 3 3h1l3 4v-4l9-3V8l-9-3H6a3 3 0 0 0-3 3z"/></svg>
        </span>
        <span class="crumb">공지사항</span>
      </div>

      <div class="page-split">
        <div class="left-form">
          <div class="form-row">
            <label class="form-label">제목</label>
            <textarea class="form-control" placeholder="제목을 입력해 주세요." style="height: 100px;"></textarea>
          </div>

          <div class="form-row">
            <label class="form-label">내용</label>
            <textarea class="form-control" placeholder="내용을 입력해 주세요." style="height: 200px;"></textarea>
          </div>

          <div class="form-row">
            <label class="form-label">게시 여부</label>
            <div class="radio-row-inline">
              <label class="radio"><input type="radio" name="post" checked><span class="box"></span>사용</label>
              <label class="radio"><input type="radio" name="post"><span class="box"></span>미사용</label>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label">긴급 공지</label>
            <div class="radio-row-inline">
              <label class="radio"><input type="radio" name="urgent"><span class="box"></span>사용</label>
              <label class="radio"><input type="radio" name="urgent" checked><span class="box"></span>미사용</label>
            </div>
          </div>

          <div style="height: 200px;"></div>
          <button class="btn-save">저장</button>
        </div>

        <div class="right-table">
          <div class="toolbar">
            <div class="right"><button class="btn-outline-sm">선택삭제</button></div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th class="col-checkbox"><label class="chk"><input type="checkbox"><span class="box"></span></label></th>
                <th>구분</th><th>제목</th><th>내용</th><th>게시여부</th><th>작성일</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><label class="chk"><input type="checkbox"><span class="box"></span></label></td>
                <td>긴급</td>
                <td>안전을 보는 것이 안전의 시작입니다.</td>
                <td>장마철 안전관리 유의하시기 바랍니다.</td>
                <td>사용</td>
                <td>2025-08-28</td>
              </tr>
              <tr>
                <td><label class="chk"><input type="checkbox"><span class="box"></span></label></td>
                <td>일반</td>
                <td>안전장비 수시 체크</td>
                <td>현장 진입 전 개인 안전장비 및 보호구는 수시로 작동 여부 체크바랍니다.</td>
                <td>사용</td>
                <td>2025-08-27</td>
              </tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'op-notice';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
