<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>계정 관리</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M5 17a4 4 0 0 1 8 0"/><line x1="14" y1="9" x2="19" y2="9"/><line x1="14" y1="13" x2="19" y2="13"/></svg>
        </span>
        <span class="crumb">계정 관리</span>
      </div>

      <div class="page-split">
        <div class="left-form">
          <div class="form-section-title">계정 권한</div>
          <div class="role-row">
            <label class="radio"><input type="radio" name="role"><span class="box"></span>관리자</label>
            <label class="radio"><input type="radio" name="role"><span class="box"></span>사용자</label>
            <label class="radio"><input type="radio" name="role"><span class="box"></span>모니터링</label>
          </div>

          <div class="form-section-title has-divider">계정 정보</div>

          <div class="form-row">
            <label class="form-label">소속사 <span class="req">*</span></label>
            <div class="select" style="width:100%;"><select style="width:100%;"><option>소속사를 선택해 주세요.</option></select></div>
          </div>

          <div class="form-row">
            <label class="form-label">이름 <span class="req">*</span></label>
            <input type="text" class="form-control" placeholder="이름을 입력해 주세요.">
          </div>

          <div class="form-row">
            <label class="form-label">아이디 <span class="req">*</span></label>
            <div class="input-check-row">
              <input type="text" class="form-control" placeholder="아이디를 입력해 주세요.">
              <button class="btn-attach">중복확인</button>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label">비밀번호 <span class="req">*</span></label>
            <div class="input-with-eye">
              <input type="password" class="form-control" value="•••••••">
              <span class="eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg></span>
            </div>
          </div>

          <div class="form-row">
            <label class="form-label">비밀번호 확인 <span class="req">*</span></label>
            <div class="input-with-eye">
              <input type="password" class="form-control" value="•••••••">
              <span class="eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/><line x1="3" y1="3" x2="21" y2="21"/></svg></span>
            </div>
          </div>

          <div class="form-section-title has-divider">추가 정보</div>

          <div class="form-row">
            <label class="form-label">핸드폰</label>
            <input type="text" class="form-control" placeholder="핸드폰 번호를 입력해 주세요.">
          </div>

          <div class="form-row">
            <label class="form-label">이메일</label>
            <input type="text" class="form-control" placeholder="이메일을 입력해 주세요.">
          </div>

          <div class="form-row">
            <label class="form-label">비고</label>
            <textarea class="form-control" placeholder="비고 입력란"></textarea>
          </div>

          <button class="btn-save bottom-submit">등록</button>
        </div>

        <div class="right-table">
          <div class="toolbar">
            <div class="select"><select><option>권한 전체</option></select></div>
            <input type="text" class="search" placeholder="아이디를 입력해 주세요.">
            <button class="btn-dark">조회 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg></button>
            <div class="right"><button class="btn-outline-sm">선택삭제</button></div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th class="col-checkbox" rowspan="2"><label class="chk"><input type="checkbox"><span class="box"></span></label></th>
                <th rowspan="2">권한</th>
                <th rowspan="2">이름</th>
                <th rowspan="2">아이디</th>
                <th rowspan="2">소속사</th>
                <th colspan="3">추가 정보</th>
              </tr>
              <tr>
                <th>핸드폰</th>
                <th>이메일</th>
                <th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td><label class="chk"><input type="checkbox"><span class="box"></span></label></td>
                <td>모니터링</td>
                <td>감리단장</td>
                <td>gsgs-1234</td>
                <td>GS 건설</td>
                <td>010-0000-0000</td>
                <td>gsgsgs@gs.org</td>
                <td>-</td>
              </tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'acct-account';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
