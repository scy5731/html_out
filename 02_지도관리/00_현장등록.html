<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>현장등록</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main map-page-main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20"/></svg>
        </span>
        <span class="crumb">현장등록</span>
      </div>

      <div class="map-split">
        <div class="map-side">
          <h4>현장 등록 설정</h4>
          <div class="form-row">
            <button class="btn-dark" style="width:100%;">시작</button>
          </div>

          <h4>지도 마우스 이동 설정</h4>
          <div class="form-row">
            <input type="text" class="form-control" placeholder="좌표를 입력해 주세요.">
          </div>

          <h4>지도 기본 색상 설정</h4>

          <h4>현장 주소 등록</h4>
          <div class="form-row">
            <div class="attach-row">
              <input type="text" class="form-control" placeholder="주소를 입력해 주세요.">
              <button class="btn-attach">주소검색 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg></button>
            </div>
          </div>

          <div style="height: 250px;"></div>
          <div class="save-area">
            <button class="btn-save">저장</button>
          </div>
        </div>

        <div class="map-area">
          <div class="map-search-overlay">
            <button class="btn-dark">스카이뷰</button>
          </div>
          <div class="map-zoom">
            <button>+</button>
            <button>−</button>
          </div>
          <svg viewBox="0 0 800 600" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
            <path d="M250,150 L500,200 L600,360 L380,420 L220,300 Z" fill="rgba(33,150,243,0.18)" stroke="#1976d2" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'map-register';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
