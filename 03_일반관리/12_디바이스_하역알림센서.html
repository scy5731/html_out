<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>디바이스 관리 - 하역 알림 센서</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="9" rx="1"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </span>
        <span class="crumb">디바이스 관리</span>
        <span class="sep">|</span>
        <span class="crumb">하역 알림 센서</span>
      </div>

      <div class="page-split">
        <div class="left-form">
          <div class="form-row"><label class="form-label">장치 이름</label><input type="text" class="form-control" placeholder="장치 이름을 입력해 주세요."></div>
          <div class="form-row"><label class="form-label">구간</label><div class="select" style="width:100%;"><select style="width:100%;"><option>구간을 선택해 주세요.</option></select></div></div>
          <div class="form-row"><label class="form-label">IP(DDNS) <span class="req">*</span></label><input type="text" class="form-control" placeholder="IP를 입력해 주세요."></div>
          <div class="form-row"><label class="form-label">PORT <span class="req">*</span></label><input type="text" class="form-control" placeholder="PORT를 입력해 주세요."></div>

          <div style="height: 480px;"></div>
          <button class="btn-save">저장</button>
        </div>

        <div class="right-table">
          <div class="toolbar">
            <div class="right"><button class="btn-outline-sm">선택삭제</button></div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th class="col-checkbox"><label class="chk"><input type="checkbox"><span class="box"></span></label></th>
                <th>NO</th><th>장치이름</th><th>구간</th><th>IP(DDNS)</th><th>PORT</th>
              </tr>
            </thead>
            <tbody>
              <tr><td><label class="chk"><input type="checkbox"><span class="box"></span></label></td><td>1</td><td>하역 알림 센서-1</td><td>구간명</td><td>111.222.333.44</td><td>123456</td></tr>
              <tr><td><label class="chk"><input type="checkbox"><span class="box"></span></label></td><td>2</td><td>하역 알림 센서-2</td><td>구간명</td><td>111.000.111.0</td><td>01230123</td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'gen-unload';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
