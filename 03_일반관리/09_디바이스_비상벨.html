<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>디바이스 관리 - 비상벨</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16a2 2 0 0 1-2 2h-3l-3 3v-3H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        </span>
        <span class="crumb">비상벨</span>
      </div>

      <div class="page-split">
        <div class="left-form">
          <div class="form-section-title">비상벨 정보</div>

          <div class="form-row"><label class="form-label">고유번호 <span class="req">*</span></label><input type="text" class="form-control" placeholder="고유 번호를 입력해 주세요."></div>
          <div class="form-row"><label class="form-label">노선 <span class="req">*</span></label><div class="select" style="width:100%;"><select style="width:100%;"><option>노선을 선택해 주세요.</option></select></div></div>
          <div class="form-row"><label class="form-label">설치 위치 <span class="req">*</span></label><div class="input-group"><input type="text" class="form-control" placeholder="텍스트 입력"><span class="suffix">m</span></div></div>
          <div class="form-row"><label class="form-label">장치 이름</label><input type="text" class="form-control" placeholder="장치 이름을 입력해 주세요."></div>
          <div class="form-row"><label class="form-label">IP</label><input type="text" class="form-control" placeholder="고유 번호를 입력해 주세요."></div>
          <div class="form-row"><label class="form-label">PORT</label><input type="text" class="form-control" placeholder="고유 번호를 입력해 주세요."></div>
          <div class="form-row">
            <label class="form-label">사진</label>
            <div class="attach-row"><input type="text" class="form-control" placeholder="사진을 등록해 주세요." readonly><button class="btn-attach">첨부하기 <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="11" r="2"/></svg></button></div>
          </div>
          <div class="form-row"><label class="form-label">비고</label><textarea class="form-control" placeholder="텍스트를 입력하세요."></textarea></div>

          <div style="height: 60px;"></div>
          <button class="btn-save bottom-submit">등록</button>
        </div>

        <div class="right-table">
          <div class="toolbar">
            <div class="select"><select><option>노선 전체</option></select></div>
            <div class="right"><button class="btn-outline-sm">선택삭제</button></div>
          </div>

          <table class="data-table">
            <thead>
              <tr>
                <th class="col-checkbox"><label class="chk"><input type="checkbox"><span class="box"></span></label></th>
                <th>고유번호</th><th>노선</th><th>설치 위치</th><th>장치 이름</th><th>비고</th>
              </tr>
            </thead>
            <tbody>
              <tr><td><label class="chk"><input type="checkbox"><span class="box"></span></label></td><td>ABC1234567890</td><td>본선 시점 | 여수 방향</td><td>1,800m</td><td>비상벨-1</td><td>-</td></tr>
              <tr><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'gen-bell';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
