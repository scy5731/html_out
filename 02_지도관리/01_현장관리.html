<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>현장관리</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main map-page-main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20"/></svg>
        </span>
        <span class="crumb">현장관리</span>
      </div>

      <div class="map-split">
        <div class="map-side">
          <h4>노선 목록</h4>
          <ul class="zone-list" style="max-height: 130px;">
            <li class="active">노선 목록 <span class="check">✓</span></li>
            <li>노선 목록</li>
          </ul>

          <h4>디바이스 목록</h4>
          <div class="tree-node">
            <span class="ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l4-3h10l4 3v12H3z"/></svg>
            CCTV
          </div>
          <div class="tree-node indent">- 고정형 CCTV</div>

          <div style="height: 320px;"></div>
          <div class="save-area">
            <button class="btn-save">저장</button>
          </div>
        </div>

        <div class="map-area">
          <div class="map-search-overlay">
            <button class="btn-dark">스카이뷰</button>
          </div>
          <div class="map-zoom">
            <button>+</button>
            <button>−</button>
          </div>
          <svg viewBox="0 0 800 600" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
            <path d="M250,150 L500,200 L600,360 L380,420 L220,300 Z" fill="rgba(33,150,243,0.18)" stroke="#1976d2" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'map-manage';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
