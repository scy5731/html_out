<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>통합 알람 - 차량 SOS (지도보기)</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>
    <main class="main">
      <div class="page-title">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0v6l2 2H4l2-2z"/></svg></span>
        <span class="crumb">통합 알람 이력</span>
      </div>

      <div class="alarm-split">
        <div class="alarm-side" id="alarm-side-slot"></div>

        <div class="right-table">
          <div class="toolbar">
            <div class="select"><select><option>노선 전체</option></select></div>
            <input type="text" class="search" placeholder="차량 종류, 번호">
            <div class="date-input-group"><input value="2025-08-28"></div>
            <span style="color:#666;">~</span>
            <div class="date-input-group"><input value="2025-08-28"></div>
            <div class="range-quick"><button class="active">오늘</button><button>1주일</button><button>1개월</button></div>
            <button class="btn-dark">조회</button>
          </div>

          <table class="data-table">
            <thead>
              <tr><th rowspan="2">노선</th><th rowspan="2">위치</th><th rowspan="2">차량종류</th><th rowspan="2">차량번호</th><th colspan="4">운전자 정보</th><th rowspan="2">수신 일시</th><th colspan="3">후속 조치</th></tr>
              <tr><th>이름</th><th>소속사</th><th>나이</th><th>연락처</th><th>작성자</th><th>조치 일시</th><th>내용</th></tr>
            </thead>
            <tbody>
              <tr><td>노선명</td><td>지도보기</td><td>덤프트럭</td><td>경기 00 가 1234</td><td>김기사</td><td>(주)오픈웍스</td><td>39세</td><td>010-0000-0000</td><td>2025-08-28<br>15:32:11</td><td>관리자</td><td>2025-08-28 18:00:01</td><td>내용보기</td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
              <tr class="empty"><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <!-- 지도보기 모달 -->
      <div class="modal-overlay">
        <div class="modal-card lg">
          <div class="modal-head"><span class="title">지도보기</span><span class="close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg></span></div>
          <div class="modal-body"><div class="map-placeholder"></div></div>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'hist-alarm'; window.__ALARM = 'vehicle-sos';</script>
  <script src="../assets/js/sidebar.js"></script>
  <script src="../assets/js/alarm-side.js"></script>
</body>
</html>
