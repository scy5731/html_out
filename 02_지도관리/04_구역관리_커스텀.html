<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>구역관리 - 커스텀</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main map-page-main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 7 9 4 15 7 21 4 21 17 15 20 9 17 3 20"/></svg>
        </span>
        <span class="crumb">구역관리</span>
      </div>

      <div class="map-split">
        <div class="map-side">
          <h4>구역유형</h4>
          <div class="zone-mode-row">
            <div class="zone-mode-btn">
              <a href="02_구역관리_비인가구역.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                비인가구역
                <span class="mark"></span>
              </a>
            </div>
            <div class="zone-mode-btn">
              <a href="03_구역관리_적산구역.html" style="display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:inherit;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16"/></svg>
                적산구역
                <span class="mark"></span>
              </a>
            </div>
            <div class="zone-mode-btn active">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 4 4 10 6 20 18 20 20 10"/></svg>
              커스텀
              <span class="mark"></span>
            </div>
          </div>

          <h4>구역 지정</h4>
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;">
            <input type="text" class="form-control" placeholder="구역명을 입력해 주세요." style="font-size:12px;height:32px;">
            <button class="btn-dark" style="height:32px;padding:0 10px;font-size:12px;">구역설정 <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-5"/></svg></button>
          </div>

          <div style="display:flex; gap: 14px; margin-bottom: 12px; padding: 6px 4px; background: #f7f7f7; border-radius: 3px;">
            <label class="radio"><input type="radio" name="picker" checked><span class="box"></span>출입</label>
            <label class="radio"><input type="radio" name="picker"><span class="box"></span>외부</label>
          </div>

          <h4>구역목록</h4>
          <ul class="zone-list">
            <li>비인가구역 비인가구역</li>
            <li>비인가구역 비인가구역-1</li>
            <li>비인가구역 비인가구역-2</li>
            <li>적산구역 비인가구역-3</li>
            <li class="active">커스텀 - 사진 구역 -1 <span class="check">✓</span></li>
            <li>커스텀 - 사진 구역 -2</li>
            <li>커스텀 - 사진 구역 -3</li>
          </ul>

          <h4>구역 설정</h4>
          <div class="form-row">
            <input type="text" class="form-control" placeholder="구역명 입력" style="margin-bottom: 8px;">
            <button class="btn-outline-sm" style="width: 100%;">수정</button>
          </div>

          <div class="color-row" style="margin-top: 8px;">
            <div>
              <span class="lbl">선</span>
              <div class="select" style="width:100%;"><select style="width:100%;"><option>● 빨강</option></select></div>
            </div>
            <div>
              <span class="lbl">투명도</span>
              <div class="select" style="width:100%;"><select style="width:100%;"><option>● 빨강</option></select></div>
            </div>
          </div>

          <div class="save-area" style="margin-top: 16px;">
            <button class="btn-save">저장</button>
          </div>
        </div>

        <div class="map-area">
          <div class="map-search-overlay">
            <button class="btn-dark">스카이뷰</button>
          </div>
          <div class="map-zoom">
            <button>+</button>
            <button>−</button>
          </div>
          <svg viewBox="0 0 800 600" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;">
            <path d="M250,150 L500,200 L600,360 L380,420 L220,300 Z" fill="rgba(33,150,243,0.18)" stroke="#1976d2" stroke-width="2"/>
          </svg>
        </div>
      </div>
    </main>
  </div>
  <script>window.__ACTIVE = 'map-zone-3';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
