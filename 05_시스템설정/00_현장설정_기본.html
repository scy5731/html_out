<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>현장 설정 - 기본</title>
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
  <div class="app">
    <div id="sidebar-slot"></div>

    <main class="main">
      <div class="page-title">
        <span class="ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 21h18"/>
            <path d="M5 21V7l7-4 7 4v14"/>
            <path d="M9 9h2v2H9zM13 9h2v2h-2zM9 13h2v2H9zM13 13h2v2h-2zM9 17h6v4H9z"/>
          </svg>
        </span>
        <span class="crumb">현장 설정</span>
      </div>

      <div style="max-width: 360px;">
        <div class="form-row">
          <label class="form-label">현장 주소 등록</label>
          <div class="input-group">
            <input type="text" class="form-control" placeholder="주소를 등록해 주세요.">
            <button class="btn-dark">
              주소검색
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16" y2="16"/></svg>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">공지사항 롤링 타임</label>
          <div class="input-group">
            <input type="text" class="form-control" value="5">
            <span class="suffix">초</span>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">CCTV 롤링 타임</label>
          <div class="input-group">
            <input type="text" class="form-control" value="30">
            <span class="suffix">초</span>
          </div>
        </div>

        <div class="form-row">
          <label class="form-label">이동형 CCTV 이탈범위(반경)</label>
          <div class="input-group">
            <input type="text" class="form-control" value="30">
            <span class="suffix">m</span>
          </div>
        </div>

        <div style="height: 280px;"></div>

        <button class="btn-save">저장</button>
      </div>
    </main>
  </div>

  <script>window.__ACTIVE = 'sys-hyeonjang';</script>
  <script src="../assets/js/sidebar.js"></script>
</body>
</html>
